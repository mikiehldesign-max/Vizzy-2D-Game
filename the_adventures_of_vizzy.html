<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Adventures of VIZZY!</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Basic page setup */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            display: none; /* Initially hidden until game starts */
            background-color: #0c0a1a;
            outline: none; /* Removes the focus border from the canvas */
        }

        #menu-bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
        }

        /* Styles for overlay screens (menu, game over, etc.) */
        #menu-screen, .message-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            z-index: 1; /* Ensure menu is on top of its background */
        }

        .message-screen {
            display: none; /* Hidden by default */
            background-color: rgba(12, 10, 26, 0.8);
        }

        .game-logo {
            max-width: 80%; /* Responsive logo size */
            width: 600px;    /* Max size for larger screens */
            margin-bottom: 40px;
            margin-top: 80px; /* Moved down more */
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .sub-logo {
            width: 100px;
            max-width: 20%;
            margin-bottom: 20px;
            margin-top: -160px; /* Moved further up */
        }

        .start-button {
            padding: 15px 30px;
            font-size: 1.5rem;
            background-color: #222;
            color: #fff;
            border: 2px solid #50a0ff; /* Changed to blue */
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
            margin: 10px; /* Spacing for level select buttons */
        }

        .start-button:hover {
            background-color: #50a0ff; /* Changed to blue */
            color: #222;
        }

        /* Style for the currently selected button for keyboard navigation */
        .start-button.selected {
            border-color: #ffeb3b; /* A bright yellow */
            box-shadow: 0 0 15px #ffeb3b;
        }

        .controls-info {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #a0a0c0;
        }

        .message-title {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .menu-button-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-button-container.vertical {
            flex-direction: column;
        }


        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            color: #FFD700;
            display: none; /* Initially hidden */
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
            padding: 10px 15px; /* Add some spacing */
            border-radius: 10px; /* Rounded corners */
            z-index: 10;
        }

        #health-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: none; /* Initially hidden */
            z-index: 10;
        }

        /* Removed #flight-timer-display CSS */

        #mute-button {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: none; /* Initially hidden */
            background: rgba(0,0,0,0.5);
            border: 1px solid #a0a0c0;
            color: #a0a0c0;
            padding: 8px 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 10;
        }

        #mute-button:hover {
            background: rgba(255,255,255,0.3);
        }

        .heart {
            width: 30px;
            height: 30px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="red"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>') no-repeat center center;
            background-size: contain;
            display: inline-block;
            margin-left: 5px;
        }

        #mobile-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            display: none; /* Initially hidden, controlled by JS */
            z-index: 20;
        }

        .mobile-button {
            position: absolute;
            bottom: 30px;
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: rgba(255, 255, 255, 0.7);
            user-select: none;
            -webkit-user-select: none; /* For Safari */
        }
        .mobile-button:active {
            background: rgba(255, 255, 255, 0.4);
        }

        #mobile-left { left: 30px; }
        #mobile-right { left: 120px; }
        #mobile-jump { right: 30px; }

    </style>
</head>

        // --- Image Loading ---

        let imageCount = Object.keys(imagesToLoad).length;
        let loadedImages = 0;

        function loadImages() {
            console.log("Starting image loading..."); // Log: Start loading
            let errorOccurred = false; // Flag to track loading errors

            for (const key in imagesToLoad) {
                images[key] = new Image();
                images[key].src = imagesToLoad[key]; // Assume URLs are direct links now

                // Add onerror handlers to img tags in HTML for better user feedback
                images[key].onerror = function() {
                    console.error(`Error loading image: ${key} at ${this.src}`); // Log: Image error
                    errorOccurred = true; // Set flag on error
                };


                images[key].onload = () => {
                    loadedImages++;
                    // console.log(`Loaded image: ${key} (${loadedImages}/${imageCount})`); // Reduce console noise
                    if (!errorOccurred && loadedImages === imageCount) {
                        console.log("All images loaded successfully."); // Log: All loaded
                        startMenuAnimation();
                    }
                };
            }
        }

        // Creates a screen-space snow effect
        function createSnow() {
            if (!canvas.width) return;
            snowParticles = [];
            const numberOfParticles = 150;
            for (let i = 0; i < numberOfParticles; i++) {
                snowParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speedY: Math.random() * 1 + 0.5
                });
            }
        }

        // Player properties
        const player = {
            x: 100, y: 400, width: 120, height: 120, speed: 3,
            velocityX: 0, velocityY: 0, isJumping: false, jumpPower: 20,
            jumps: 0, maxJumps: 2, health: 4, maxHealth: 4, invincible: false,
            invincibleTimer: 0, isDying: false, deathTimer: 0,
            isFlying: false, flightTimer: 0,
            gameFrame: 0, staggerFrames: 10, direction: 'right'
        };

        // World properties
        const gravity = 1;

        // Camera for scrolling
        const camera = { x: 0, y: 0 };

        // --- Level Data ---
        let platforms = [], coins = [], turrets = [], decorations = [], enemies = [], signs = [], powerUps = [];
        let levelWidth = 8000;

        function setupLevel() {
            // Player reset
            player.x = 100; player.y = 400; player.velocityX = 0; player.velocityY = 0;
            player.isJumping = true; player.health = player.maxHealth; player.invincible = false;
            player.invincibleTimer = 0; player.isDying = false; player.deathTimer = 0;
            player.isFlying = false; player.flightTimer = 0;
            updateHealthBar(); camera.x = 0;
            globalGameTime = 0; // Reset global timer

            if (currentLevel === 1) {
                setupLevel1();
            } else if (currentLevel === 2) { // Now loads original level 3 data
                setupOriginalLevel3();
            } else if (currentLevel === 3) { // Now loads original level 2 data
                setupOriginalLevel2();
            }
        }

        function setupLevel1() {
            levelWidth = 8000;
            currentFriction = 0.6; // Normal friction
            platforms = [
                { x: 0, y: 550, width: 800, height: 50 },
                { x: 600, y: 450, width: 250, height: 50, initialY: 450 },
                { x: 900, y: 350, width: 150, height: 50, initialY: 350 },
                { x: 1200, y: 450, width: 360, height: 50, initialY: 450 },
                { x: 1550, y: 300, width: 100, height: 50, initialY: 300 },
                { x: 1750, y: 250, width: 100, height: 50, initialY: 250 },
                { x: 2100, y: 500, width: 300, height: 50, initialY: 500 },

        // --- Game Flow & Menu Navigation ---
        function handleMenuInput(e, menuType) {
            let buttons;
            let activeIndex;
            let maxIndex;

            if (menuType === 'main') {
                buttons = menuScreen.querySelectorAll('.start-button');
                activeIndex = activeMainMenuIndex;
            } else if (menuType === 'pause') {
                buttons = pauseScreen.querySelectorAll('.start-button');
                activeIndex = activePauseMenuIndex;
            } else if (menuType === 'gameover') {
                buttons = gameOverScreen.querySelectorAll('.start-button');
                activeIndex = activeGameOverMenuIndex;
            } else if (menuType === 'win') {
                // Get only the visible buttons on the win screen
                buttons = Array.from(winScreen.querySelectorAll('.start-button')).filter(btn => btn.style.display !== 'none');
                activeIndex = activeWinMenuIndex;
            }

            if (!buttons || buttons.length === 0) return;
            maxIndex = buttons.length - 1;

            if (e.code === 'ArrowRight' && menuType !== 'win') {
                activeIndex++;
                if (activeIndex > maxIndex) activeIndex = 0;
            } else if (e.code === 'ArrowLeft' && menuType !== 'win') {
                activeIndex--;
                if (activeIndex < 0) activeIndex = maxIndex;
            } else if (e.code === 'ArrowDown' && menuType === 'win') {
                activeIndex++;
                if (activeIndex > maxIndex) activeIndex = 0;
            } else if (e.code === 'ArrowUp' && menuType === 'win') {
                activeIndex--;
                if (activeIndex < 0) activeIndex = maxIndex;
            } else if (e.code === 'Enter') {
                buttons[activeIndex].click();
                return;
            }

            if (menuType === 'main') activeMainMenuIndex = activeIndex;
            else if (menuType === 'pause') activePauseMenuIndex = activeIndex;
            else if (menuType === 'gameover') activeGameOverMenuIndex = activeIndex;
            else if (menuType === 'win') activeWinMenuIndex = activeIndex;

            updateMenuSelection(menuType);
        }

        function updateMenuSelection(menuType) {
            let buttons;
            let activeIndex;

            if (menuType === 'main') {
                buttons = menuScreen.querySelectorAll('.start-button');
                activeIndex = activeMainMenuIndex;
            } else if (menuType === 'pause') {
                buttons = pauseScreen.querySelectorAll('.start-button');
                activeIndex = activePauseMenuIndex;
            } else if (menuType === 'gameover') {
                buttons = gameOverScreen.querySelectorAll('.start-button');
                activeIndex = activeGameOverMenuIndex;
            } else if (menuType === 'win') {
                buttons = Array.from(winScreen.querySelectorAll('.start-button')).filter(btn => btn.style.display !== 'none');
                activeIndex = activeWinMenuIndex;
            }

            if (!buttons) return;

            buttons.forEach((button, index) => {
                if (index === activeIndex) {
                    button.classList.add('selected');
                } else {
                    button.classList.remove('selected');
                }
            });
        }

        // --- Main Game Loop ---
        function gameLoop() {
            if (!gameActive) return;
            globalGameTime++; // Increment global timer
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (player.isDying) {
                player.deathTimer--;
                player.velocityY += gravity * 0.5;
                player.y += player.velocityY;
                if (player.deathTimer <= 0) { showMessage(gameOverScreen); }
                return;
            }

            // --- Fireball Spawning (Only for Level 3) ---
            if (currentLevel === 3) {
                fireballSpawners.forEach(spawner => {
                    spawner.timer++;
                    // Use modulo for continuous spawning after delay
                    if (spawner.delay > 0) {
                         if (spawner.timer >= spawner.delay) {
                             spawner.delay = 0; // Remove delay after first time
                             spawner.timer = 0; // Reset timer to start interval timing
                         }
                    } else if (spawner.timer >= spawner.interval) {
                        spawner.timer = 0; // Reset interval timer
                        // Spawn a fireball
                        fireballs.push({
                            x: spawner.x,
                            y: camera.y + canvas.height + 50, // Start below camera view
                            width: 85,  // Adjusted width
                            height: 187, // Adjusted height
                            velocityY: -20, // Slower upward velocity
                            gameFrame: 0,
                            staggerFrames: 8 // Animation speed for fireball
                        });
                    }
                });
            }


            // Update Projectiles (Snowballs)
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                proj.x += proj.velocityX;
                proj.y += proj.velocityY;
                // Remove if off-screen
                if (proj.x < camera.x - 100 || proj.x > camera.x + canvas.width + 100 || proj.y > camera.y + canvas.height + 100) { // Adjusted check for camera
                    projectiles.splice(i, 1);
                }
            }
             // Update Fireballs
             for (let i = fireballs.length - 1; i >= 0; i--) {
                const fb = fireballs[i];
                fb.velocityY += gravity * 0.5; // Apply gravity
                fb.y += fb.velocityY;
                fb.gameFrame++;
                // Remove if fallen off bottom (relative to camera)
                if (fb.y > camera.y + canvas.height + 100) {
                    fireballs.splice(i, 1);
                }
             }

            // Snow particle update (only when currentLevel loads original L3 data)
            if (currentLevel === 2) { // SWAPPED: Snow now appears on new Level 2
                snowParticles.forEach(p => {
                    p.y += p.speedY;
                    // Reset snow that falls off screen
                    if (p.y > canvas.height) {
                        p.y = 0;
                        p.x = Math.random() * canvas.width;
                    }
                });
            }

            // Platforms & Decorations
            platforms.forEach(p => {
                if (p.initialY) {
                    // Increased amplitude and speed for floating platforms
                    p.y = p.initialY + Math.sin(Date.now() * 0.002 + p.x) * 20;
                }
            });

            // Enemies
            enemies.forEach(e => {
                if (e.isDying) {
                    e.velocityY += gravity * 0.5; // Fall down
                    e.y += e.velocityY;
                    e.deathTimer--;
                    return; // Skip normal movement logic if dying
                }

                if (e.type === 'bird') {
                    const distanceX = player.x - e.initialX;
                    const distanceY = player.y - e.initialY;
                    const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

                    if (distance < e.detectionRange) {
                        e.state = 'attacking';
                    } else {
                        e.state = 'hovering';
                    }

                    let targetY;
                    if (e.state === 'attacking') {
                        targetY = e.initialY; // Swoop down to attack position
                    } else {
                        targetY = e.hoverY; // Return to high hover position
                    }

                    // Smoothly move towards the targetY
                    e.y += (targetY - e.y) * 0.02;

                    // Keep horizontal circular motion
                    const radius = 30;
                    e.x = e.initialX + Math.cos(Date.now() * e.speed + e.initialY) * radius;

                } else if (e.type === 'rat' || e.type === 'snowman') {
                    const platform = platforms[e.platformIndex];
                    if (platform) {
                        const minX = platform.x;
                        const maxX = platform.x + platform.width - e.width;
                        e.x += e.speed * e.direction;
                        if (e.x <= minX || e.x >= maxX) {
                            e.direction *= -1;
                        }
                        e.y = platform.y - e.height; // Make sure it stays on the platform
                    }
                    // Snowman specific attack logic
                    if (e.type === 'snowman') {
                        if (e.fireCooldown > 0) {
                            e.fireCooldown--;
                        }
                        const distanceX = (player.x + player.width / 2) - (e.x + e.width / 2);
                        const distanceY = (player.y + player.height / 2) - (e.y + e.height / 2);
                        const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

                        if (distance < e.detectionRange && e.fireCooldown <= 0) {
                            e.fireCooldown = 90; // 1.5 seconds cooldown
                            const speed = 8; // Faster snowballs
                            const angle = Math.atan2(distanceY, distanceX);
                            projectiles.push({
                                x: e.x + e.width / 2,
                                y: e.y + e.height / 2,
                                width: 15,
                                height: 15,
                                velocityX: Math.cos(angle) * speed,
                                velocityY: Math.sin(angle) * speed,
                            });
                        }
                    }
                }
                 else { // Default circular motion for butterflies
                    const radius = 30;
                    const speed = e.speed;
                    e.x = e.initialX + Math.cos(Date.now() * speed + e.initialY) * radius;
                    e.y = e.initialY + Math.sin(Date.now() * speed + e.initialY) * radius;
                }
                e.gameFrame++;
            });

            // Player Movement
            if (keys.left) { player.velocityX -= player.speed; player.direction = 'left'; }
            if (keys.right) { player.velocityX += player.speed; player.direction = 'right'; }
            player.velocityX = Math.max(-10, Math.min(10, player.velocityX));

            if (player.isFlying) {
                if (keys.up) {
                    player.velocityY = -5; // Fly up
                } else if (keys.down) {
                    player.velocityY = 5; // Fly down
                } else {
                    player.velocityY = 0; // Hover
                }
                player.flightTimer--;
                 // Removed flight timer display update
                if (player.flightTimer <= 0) {
                    player.isFlying = false;
                    wingFlapSound.pause();
                    // Removed flight timer display hide
                }
            } else {
                 // Removed flight timer display hide check
                if (keys.upPressed && player.jumps < player.maxJumps) {
                    player.velocityY = -player.jumpPower;
                    player.isJumping = true;
                    player.jumps++;
                    keys.upPressed = false;
                    jumpSound.currentTime = 0;
                    jumpSound.play().catch(e => console.warn("Jump sound couldn't play:", e));
                }
                 // Physics
                player.velocityY += gravity;
            }

            player.x += player.velocityX;
            player.y += player.velocityY;
            player.velocityX *= currentFriction;


            // Sounds
            const isWalking = !player.isJumping && Math.abs(player.velocityX) > 1 && !player.isFlying;
            if (isWalking && walkSound.paused) { walkSound.play().catch(e => console.warn("Walk sound couldn't play:", e)); }
            else if (!isWalking && !walkSound.paused) { walkSound.pause(); walkSound.currentTime = 0; }

            // Animation
            if (Math.abs(player.velocityX) > 0.1 || player.isFlying) { player.gameFrame++; }
            else { player.gameFrame = 0; }

            // Invincibility Timer
            if (player.invincible) {
                player.invincibleTimer--;
                if (player.invincibleTimer <= 0) { player.invincible = false; }
            }

            // --- Platform Collision Detection ---
            let onPlatform = false;
            if (!player.isDying && !player.isFlying) {
                for (const p of platforms) {
                    // Only check for landing if the player is moving downwards.
                    if (player.velocityY >= 0) {
                        const playerLeft = player.x + 40; // Narrow hitbox
                        const playerRight = player.x + player.width - 40; // Narrow hitbox

                        // Check for horizontal overlap
                        if (playerRight > p.x && playerLeft < p.x + p.width) {
                            const previousPlayerBottom = (player.y + player.height) - player.velocityY;

                            // Check if player's feet have crossed the platform's top surface in this frame
                            if (previousPlayerBottom <= p.y + 1) { // +1 for tolerance
                                const currentPlayerBottom = player.y + player.height;
                                if (currentPlayerBottom >= p.y) {
                                    // Landed!
                                    player.y = p.y - player.height; // Snap to top
                                    player.velocityY = 0;
                                    player.isJumping = false;
                                    player.jumps = 0;
                                    onPlatform = true;
                                    if (p.isGoal) {
                                        showMessage(winScreen);
                                        return; // Exit update loop
                                    }
                                    break; // Stop checking other platforms
                                }
                            }
                        }
                    }
                }
            }


            if (!onPlatform && !player.isFlying) { player.isJumping = true; }

            for (const c of coins) {
                if (c.active && player.x < c.x + c.width && player.x + player.width > c.x &&
                    player.y < c.y + c.height && player.y + player.height > c.y) {
                    c.active = false;
                    score += 10;
                    scoreDisplay.textContent = `Score: ${score}`;
                    coinSound.currentTime = 0;
                    coinSound.play().catch(e => console.warn("Coin sound couldn't play:", e));
                }
            }

            // Power-up Collision
            for (const p of powerUps) {
                if (p.active && player.x < p.x + p.width && player.x + player.width > p.x &&
                    player.y < p.y + p.height && player.y + player.height > p.y) {
                    p.active = false;
                    if (p.type === 'feather') {
                        player.isFlying = true;
                        player.flightTimer = 480; // 8 seconds * 60 fps
                        powerupSound.currentTime = 0;
                        powerupSound.play().catch(e => console.warn("Powerup sound couldn't play:", e));

                        // Play wing sound regardless of mute state
                        wingFlapSound.currentTime = 0;
                        wingFlapSound.playbackRate = 3.38; // Make sound faster
                        wingFlapSound.play().catch(e => console.warn("Wing sound couldn't play:", e));
                    }
                }
            }

            // Hazard Collision (Removed thorn bush logic)

            // Enemy and Projectile/Fireball collision logic
            if (!player.invincible) {
                // Projectile (Snowball) collision
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const proj = projectiles[i];
                    if (player.x < proj.x + proj.width && player.x + player.width > proj.x &&
                        player.y < proj.y + proj.height && player.y + player.height > proj.y) {

                        projectiles.splice(i, 1); // Remove snowball on hit

                        // Player gets hurt
                        player.health--;
                        updateHealthBar();
                        player.invincible = true;
                        player.invincibleTimer = 120;
                        hurtSound.currentTime = 0;
                        hurtSound.play().catch(err => console.warn("Hurt sound couldn't play:", err));
                        player.isFlying = false;
                        wingFlapSound.pause();
                        player.velocityY = -10;
                        player.velocityX = (player.x < proj.x) ? -10 : 10;
                        if (player.health <= 0) {
                            startDeathSequence();
                            return; // Exit update loop
                        }
                    }
                }
                 // Fireball collision
                 for (let i = fireballs.length - 1; i >= 0; i--) {
                    const fb = fireballs[i];
                     // Slightly adjusted hitbox for fireballs (using new height)
                    if (player.x < fb.x + fb.width - 10 && player.x + player.width > fb.x + 10 &&
                        player.y < fb.y + fb.height - 10 && player.y + player.height > fb.y + 10) {

                        // Don't remove fireball on hit - let it pass through
                        // fireballs.splice(i, 1);

                        // Player gets hurt
                        player.health--;
                        updateHealthBar();
                        player.invincible = true;
                        player.invincibleTimer = 120;
                        hurtSound.currentTime = 0;
                        hurtSound.play().catch(err => console.warn("Hurt sound couldn't play:", err));
                        player.isFlying = false;
                        wingFlapSound.pause();
                        player.velocityY = -10; // Knockback up
                        player.velocityX = (player.x + player.width / 2 < fb.x + fb.width / 2) ? -10 : 10; // Knockback left/right
                        if (player.health <= 0) {
                            startDeathSequence();
                            return; // Exit update loop
                        }
                         break; // Only take damage from one fireball per frame if overlapping
                    }
                 }


                for (const e of enemies) {
                     if (e.isDying || player.invincible) continue; // Skip dead enemies or if player is invincible

                     if (player.x < e.x + e.width && player.x + player.width > e.x &&
                         player.y < e.y + e.height && player.y + player.height > e.y) {

                         // Check for stomp
                         const isStomp = player.velocityY > 0 && (player.y + player.height) < (e.y + e.height / 2);

                         if (isStomp) {
                             e.isDying = true;
                             e.deathTimer = 60; // 1 second
                             e.velocityY = -5; // Enemy pops up
                             player.velocityY = -15; // Player bounces
                             player.jumps = 1; // Allow one more jump mid-air
                             stompSound.currentTime = 0;
                             stompSound.play().catch(err => console.warn("Stomp sound couldn't play:", err));
                             score += 20;
                             scoreDisplay.textContent = `Score: ${score}`;
                         } else {
                             // Player gets hurt
                             player.health--;
                             updateHealthBar();
                             player.invincible = true;
                             player.invincibleTimer = 120; // 2 seconds of invincibility
                             hurtSound.currentTime = 0;
                             hurtSound.play().catch(err => console.warn("Hurt sound couldn't play:", err));
                             player.isFlying = false; // Knocked out of the air
                             wingFlapSound.pause(); // Stop flight sound on hit
                             player.velocityY = -10; // Knockback
                             player.velocityX = (player.x < e.x + e.width / 2) ? -10 : 10;
                             if (player.health <= 0) {
                                 startDeathSequence();
                                 return;
                             }
                             break; // Stop checking other enemies for this frame
                         }
                     }
                 }
            }


            // Boundaries
            if (player.x < 0) { player.x = 0; player.velocityX = 0; }
            if (player.x + player.width > levelWidth) { player.x = levelWidth - player.width; player.velocityX = 0; }

            // Camera
            camera.x = player.x - canvas.width / 2.5;
            if (camera.x < 0) camera.x = 0;
            if (camera.x > levelWidth - canvas.width) camera.x = levelWidth - canvas.width;

            // Lose Condition
            if (player.y > camera.y + canvas.height + 200) { // Check relative to camera bottom + buffer
                player.health--;
                updateHealthBar();
                if (player.health <= 0) {
                    startDeathSequence();
                } else {
                    gameOverSound.currentTime = 0;
                    gameOverSound.play().catch(e => console.warn("Game over sound couldn't play:", e));
                    // Respawn logic <<< CHANGED TO START POSITION
                    player.x = 100; // Go back to level start X
                    player.y = 400; // Go back to level start Y
                    player.velocityX = 0;
                    player.velocityY = 0;
                    player.invincible = true; // Make invincible briefly after respawn
                    player.invincibleTimer = 120;
                    camera.x = 0; // Reset camera to the start as well
                }
            }


            // Filter out dead enemies
            enemies = enemies.filter(e => !e.isDying || e.deathTimer > 0);
        }

        // --- STABLE DRAW FUNCTION ---
        function draw() {
            // Base background color
            ctx.fillStyle = '#0c0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // --- Define Layers for current level ---
            let bgLayers = [];
            let fgLayer = {};
            let platformImgKey; // Key to access the correct platform image

            // SWAPPED DRAW LOGIC
            if (currentLevel === 1) {
                bgLayers = [
                    { img: images.level1FarBg, speed: 0.25 },
                    { img: images.level1Bg, speed: 0.5 }
                ];
                fgLayer = { img: images.level1Foreground, speed: 2.0, scale: 1.0 };
                platformImgKey = 'platform';
            } else if (currentLevel === 2) { // New Level 2 uses Original L3 assets
                bgLayers = [
                    { img: images.level3FarBg, speed: 0.25, scale: 0.6, alignTop: true },
                    { img: images.level3Bg, speed: 0.5, scale: 0.5, yOffsetPercent: 0.25 }
                ];
                fgLayer = { img: images.level3Foreground, speed: 2.0, scale: 1.25/3 };
                platformImgKey = 'platform3';
            } else if (currentLevel === 3) { // New Level 3 uses Original L2 assets
                bgLayers = [
                    { img: images.level2FarBg, speed: 0.25 },
                    { img: images.level2Bg, speed: 0.5 }
                ];
                // Scale was 1/3, doubling it to 2/3
                fgLayer = { img: images.level2Foreground, speed: 2.0, scale: 2/3 }; // Changed scale
                platformImgKey = 'platform2';
            }


            // --- Draw Background Layers ---
            bgLayers.forEach(layer => {
                if (!layer.img || !layer.img.complete || layer.img.naturalHeight === 0) {
                     // console.warn(`Background layer image not ready or invalid: ${layer.img ? layer.img.src : 'undefined'}`); // Reduce console noise
                     return;
                }

                const scale = layer.scale || 1.0;
                const drawWidth = layer.img.width * scale;
                const drawHeight = layer.img.height * scale;

                let yPos = canvas.height - drawHeight; // Default to bottom anchor
                if (layer.alignTop) {
                    yPos = 0;
                } else if (layer.yOffsetPercent) {
                    const yOffset = canvas.height * layer.yOffsetPercent;
                    yPos -= yOffset;
                }

                const parallaxX = camera.x * layer.speed;
                const startX = -(parallaxX % drawWidth);
                for (let i = 0; (startX + (i * drawWidth)) < canvas.width; i++) {
                    ctx.drawImage(layer.img, startX + i * drawWidth, yPos, drawWidth, drawHeight);
                }
            });

             // --- ADD LIGHTNING FLASH EFFECT for Level 3 ---
            if (currentLevel === 3) {
                const flashInterval = 4000; // 4 seconds in milliseconds
                const flashDuration = 100; // 0.1 seconds in milliseconds
                const time = Date.now();
                if (time % flashInterval < flashDuration) {
                    // Draw a semi-transparent white overlay
                    ctx.save(); // Save context state
                    // Keep flash relative to screen, not world
                    ctx.globalAlpha = 0.4; // Set transparency
                    ctx.fillStyle = '#FFFFFF'; // White color
                    ctx.fillRect(0, 0, canvas.width, canvas.height); // Draw over entire canvas
                    ctx.restore(); // Restore original context state (alpha, fillStyle)
                }
            }


            // Snow is drawn AFTER backgrounds, only on new level 2 (original L3)
            if (currentLevel === 2) { // SWAPPED
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                snowParticles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
            }


            // --- GAME OBJECTS (World Space) ---
            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            platforms.forEach(p => {
                let platformImg = images[platformImgKey]; // Use the determined key
                if (p.isGoal) platformImg = images.goalPlatform;

                if(platformImg && platformImg.complete && platformImg.naturalHeight > 0) {
                    // Optimized platform drawing slightly
                    const tileWidth = platformImg.width;
                    const numTiles = Math.ceil(p.width / tileWidth);
                    for (let i = 0; i < numTiles; i++) {
                         const drawX = p.x + (i * tileWidth);
                         // Prevent drawing fully outside the camera view (simple optimization)
                         if (drawX + tileWidth > camera.x && drawX < camera.x + canvas.width) {
                            ctx.drawImage(platformImg, drawX, p.y, tileWidth, p.height);
                         }
                    }
                }
            });


            decorations.forEach(d => {
                const platform = platforms[d.platformIndex];
                // Ensure the image exists and the platform index is valid before drawing
                if (d.img && platform && d.img.complete && d.img.naturalHeight > 0) {
                    const decorY = d.hangs ? platform.y + platform.height : platform.y - d.height;
                    // Check if decorY is a valid number before drawing
                    if (isFinite(decorY)) {
                         // Simple culling
                         if (d.x + d.width > camera.x && d.x < camera.x + canvas.width) {
                             ctx.drawImage(d.img, d.x, decorY, d.width, d.height);
                         }
                    } else {
                         // console.warn("Invalid decorY calculated for decoration:", d); // Reduce noise
                    }
                } else if (!platform && d.platformIndex !== undefined) { // Added check for undefined index
                     // console.warn("Platform not found for decoration:", d); // Reduce noise
                }
            });


            coins.forEach(c => {
                if (c.active && images.coin && images.coin.complete) {
                    // Simple culling
                     if (c.x + c.width > camera.x && c.x < camera.x + canvas.width) {
                        const coinY = c.initialY + Math.sin(Date.now() * 0.005 + c.x) * 5;
                        ctx.drawImage(images.coin, c.x, coinY, c.width, c.height);
                     }
                }
            });

            powerUps.forEach(p => {
                if (p.active && images.feather && images.feather.complete) {
                     // Simple culling
                     if (p.x + p.width > camera.x && p.x < camera.x + canvas.width) {
                        const powerUpY = p.initialY + Math.sin(Date.now() * 0.002 + p.x) * 20;
                        if (p.type === 'feather') {
                            ctx.drawImage(images.feather, p.x, powerUpY, p.width, p.height);
                        }
                     }
                }
            });

            // Draw Hazards (Removed thorn bush logic)

            enemies.forEach(e => {
                if (e.isDying && Math.floor(Date.now() / 100) % 2 !== 0) return;
                 // Simple culling
                 if (e.x + e.width < camera.x || e.x > camera.x + canvas.width) return;

                let frame1, frame2;
                if (e.type === 'butterfly') { frame1 = images.enemy1; frame2 = images.enemy2; }
                else if (e.type === 'bird') { frame1 = images.level2Enemy1; frame2 = images.level2Enemy2; } // Uses original L2 bird images
                else if (e.type === 'rat') { frame1 = images.rat1; frame2 = images.rat2; } // Uses original L2 rat images
                else if (e.type === 'snowman') { frame1 = images.snowman1; frame2 = images.snowman2; } // Uses original L3 snowman images

                if (!frame1 || !frame1.complete || !frame2 || !frame2.complete) return;

                const frame = Math.floor(e.gameFrame / e.staggerFrames) % 2 === 0 ? frame1 : frame2;
                ctx.save();
                if (e.direction === -1) {
                    ctx.scale(-1, 1);
                    ctx.drawImage(frame, -e.x - e.width, e.y, e.width, e.height);
                } else {
                    ctx.drawImage(frame, e.x, e.y, e.width, e.height);
                }
                ctx.restore();
            });

            // Player
            const isInvincibleBlink = player.invincible && Math.floor(Date.now() / 100) % 2 !== 0;
            const isFlightEndingBlink = player.isFlying && player.flightTimer <= 120 && Math.floor(Date.now() / 100) % 2 !== 0;

            if (!isInvincibleBlink && !isFlightEndingBlink) {
                let currentImage;
                const isRunning = Math.abs(player.velocityX) > 0.1;
                // Sliding logic depends on current level friction setting (set in setup functions)
                const isSliding = currentFriction > 0.8 && isRunning && !keys.left && !keys.right && !player.isJumping;

                if (player.isFlying) {
                    const flightStaggerFrames = 12;
                    currentImage = (Math.floor(player.gameFrame / flightStaggerFrames) % 2 === 0) ? images.playerJump : images.playerFly;
                }
                else if (player.isDying || player.isJumping) { currentImage = images.playerJump; }
                else if (isSliding) { currentImage = images.playerIdle; }
                else if (isRunning) { currentImage = (Math.floor(player.gameFrame / player.staggerFrames) % 2 === 0) ? images.playerRun1 : images.playerRun2; }
                else { currentImage = images.playerIdle; }

                if (currentImage && currentImage.complete && currentImage.naturalHeight > 0) {
                    ctx.save();
                    let playerDrawY = player.y;
                    if (player.isFlying) {
                        const hoverAmplitude = 10;
                        const hoverSpeed = 0.003;
                        playerDrawY += Math.sin(Date.now() * hoverSpeed) * hoverAmplitude;
                    }

                    if (player.direction === 'left') {
                        ctx.scale(-1, 1);
                        ctx.drawImage(currentImage, -player.x - player.width, playerDrawY, player.width, player.height);
                    } else {
                        ctx.drawImage(currentImage, player.x, playerDrawY, player.width, player.height);
                    }
                    ctx.restore();
                }
            }

            // Draw Projectiles (Snowballs)
            projectiles.forEach(proj => {
                 // Simple culling
                 if (proj.x + proj.width > camera.x && proj.x < camera.x + canvas.width) {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.strokeStyle = '#87CEEB';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, proj.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                 }
            });
             // Draw Fireballs
             fireballs.forEach(fb => {
                 // Simple culling
                 if (fb.x + fb.width > camera.x && fb.x < camera.x + canvas.width) {
                    const frame = Math.floor(fb.gameFrame / fb.staggerFrames) % 2 === 0 ? images.fireball1 : images.fireball2;
                    if (frame && frame.complete && frame.naturalHeight > 0) {
                         ctx.drawImage(frame, fb.x, fb.y, fb.width, fb.height);
                    }
                 }
            });


            ctx.restore(); // End world space drawing

            // --- Draw Foreground Layer ---
            if (fgLayer.img && fgLayer.img.complete && fgLayer.img.naturalHeight > 0) {
                const scale = fgLayer.scale || 1.0;
                const drawWidth = fgLayer.img.width * scale;
                const drawHeight = fgLayer.img.height * scale;
                const parallaxX = camera.x * fgLayer.speed;
                const startX = -(parallaxX % drawWidth);
                for (let i = 0; (startX + (i * drawWidth)) < canvas.width; i++) {
                    // Check if tile is on screen before drawing
                    const tileX = startX + i * drawWidth;
                    if(tileX + drawWidth > 0 && tileX < canvas.width) {
                       ctx.drawImage(fgLayer.img, tileX, canvas.height - drawHeight, drawWidth, drawHeight);
                    }
                }
            }

        }

        // --- UI & Utility Functions ---
        function updateHealthBar() {
            healthBar.innerHTML = '';
            for (let i = 0; i < player.health; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                healthBar.appendChild(heart);
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            menuBgCanvas.width = window.innerWidth;
            menuBgCanvas.height = window.innerHeight;
            // Re-create snow if the current level should have it (now level 2)
            if(gameActive && currentLevel === 2) createSnow();
        }

        // --- Menu Animation ---
        let menuAnimationId;
        const menuBgState = {
            frames: ['menuBg1', 'menuBg2', 'menuBg3', 'menuBg4', 'menuBg5', 'menuBg6'],
            currentFrame: 0,
            direction: 1,
            timer: 0,
            delay: 15
        };

        function menuAnimationLoop() {
            const currentImage = images[menuBgState.frames[menuBgState.currentFrame]];
            if (currentImage && currentImage.complete && currentImage.naturalHeight > 0) {
                menuBgCtx.drawImage(currentImage, 0, 0, menuBgCanvas.width, menuBgCanvas.height);
            }

            menuBgState.timer++;
            if (menuBgState.timer > menuBgState.delay) {
                menuBgState.timer = 0;
                if (menuBgState.currentFrame >= menuBgState.frames.length - 1 && menuBgState.direction === 1) {
                    menuBgState.direction = -1;
                } else if (menuBgState.currentFrame <= 0 && menuBgState.direction === -1) {
                    menuBgState.direction = 1;
                }
                menuBgState.currentFrame += menuBgState.direction;
            }

            menuAnimationId = requestAnimationFrame(menuAnimationLoop);
        }

        function startMenuAnimation() {
            console.log("startMenuAnimation called."); // Log: Function called
            if (!menuAnimationId) {
                resizeCanvas();
                menuAnimationLoop();
                // Set initial selection on main menu
                updateMenuSelection('main');
                console.log("Menu animation loop started."); // Log: Loop started
            } else {
                 console.log("Menu animation already running."); // Log: Already running
            }
        }

        function stopMenuAnimation() {
            if (menuAnimationId) {
                cancelAnimationFrame(menuAnimationId);
                menuAnimationId = null;
                menuMusic.pause();
                 console.log("Menu animation stopped."); // Log: Stopped
            }
        }

        // Initialize
        window.onload = () => {
            console.log("Window loaded. Starting image loading process."); // Log: Window onload
            resizeCanvas();
            loadImages();
            muteButton.style.display = 'block';
        };

        window.addEventListener('resize', resizeCanvas);

    </script>
</body>
</html>
